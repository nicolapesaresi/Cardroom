# standard rules for each variant
variants:

  liscia:
    name: "Scopa Liscia"
    description: "Aces don't take everything, there are starting table cards, no maratona or 10 Genovese."
    points:
      carte: true
      sette_bello: true
      primiera: true
      ori: true
      scopa: true
      maratona: false
      genovese: false
    rules:
      cards_in_hand: 3
      table_cards: 4
      ace_sweeps: false
      ace_first_card: true # because it doesn't sweep
      scopa_last_card: false
      primiera_by_points: true
    
    assi:
      name: "Scopa d'Assi"
      description: "Aces take everything, there are starting table cards, no ace as first card, there is Maratona."
      points:
        carte: true
        sette_bello: true
        primiera: true
        ori: true
        scopa: true
        maratona: true
        genovese: false
      rules:
        cards_in_hand: 3
        table_cards: 4
        ace_sweeps: true
        ace_first_card: false
        scopa_last_card: false
        primiera_by_points: true