[project]
name = "cardroom-python"
version = "0.1.0"
description = "Python tooling and analysis for the Cardroom card games"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.13",
]

[dependency-groups]
notebook = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
